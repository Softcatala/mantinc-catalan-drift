    text: El conjunto de piezas expuestas en el museo permiten hacer un repaso de la vida cotidiana en
      un pueblo campesino de hace 100 años. Destacan las colecciones de herramientas de labranza, ajuar
      de la casa e instrumentos musicales.
  - id: doc4
    lang: es
    source_dataset: parcsequipaments_es
    record_id: parcs22559905
    source_url: https://do.diba.cat/api/dataset/parcsequipaments_es/format/json/pag-ini/1/pag-fi/700
