[project]
name = "mantinc-catalan-drift"
version = "0.1.0"
description = "Benchmark for evaluating whether language models keep responding in Catalan."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "lm-eval>=0.4.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lm_eval_tasks*", "mantinc*"]

[tool.setuptools.package-data]
"lm_eval_tasks.catalan_drift" = ["*.yaml", "*.jsonl"]

[project.optional-dependencies]
api = [
    "lm-eval[api,litellm]>=0.4.9",
    "openai>=1.93.0",
]
local = [
    "accelerate>=1.10.0",
    "sentencepiece>=0.2.0",
    "torch==2.6.0",
    "transformers>=4.53.0",
]

[dependency-groups]
dev = [
    "aiohttp>=3.12.0",
    "pytest>=8.4.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
